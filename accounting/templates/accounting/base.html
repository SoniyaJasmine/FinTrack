
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinTrack - Accounting System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        nav {
            background: #172554;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #ffffff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 85%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        .message {
            padding: 15px;
            margin-bottom: 20px;
            background: #dcfce7;
            color: #166534;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e2e8f0;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 25px 0;
        }

        .summary h3 {
            margin-bottom: 12px;
        }

        .summary p {
            font-size: 24px;
            font-weight: bold;
        }

        @media(max-width: 700px) {
            .summary {
                grid-template-columns: 1fr;
            }

            .container {
                width: 92%;
            }

            nav {
                padding: 18px 4%;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>FinTrack</h2>

        <div>
            <a href="{% url 'transaction_list' %}">Dashboard</a>
            <a href="{% url 'add_transaction' %}">Add Transaction</a>
            <a href="{% url 'categorize_transactions' %}">Categorize</a>
            <a href="{% url 'add_category' %}">Add Category</a>
            <a href="{% url 'predictive_analytics' %}">Financial Insights</a>
        </div>
    </nav>

    <div class="container">

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
