
{% extends 'accounting/base.html' %}

{% block content %}

<div class="card">

    <h2>Add New Transaction</h2>

    <p style="margin: 12px 0 25px; color: #64748b;">
        Enter your income or expense details below.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}

            <div class="form-group">

                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <p style="color: red;">{{ error }}</p>
                {% endfor %}

            </div>

        {% endfor %}

        <button type="submit" class="btn">
            Save Transaction
        </button>

        <a href="{% url 'transaction_list' %}"
           style="margin-left: 15px; text-decoration: none;">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
